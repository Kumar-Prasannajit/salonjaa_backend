openapi: 3.0.3
info:
  title: Salonjaa API
  version: "1.0.0"
  description: >
    Multi-city salon discovery, booking, and management platform.
    This spec covers only what is actually implemented and tested today
    (Modules 1-4: Auth, User + Address, Salon + Branch, Staff + Service),
    per docs/PROGRESS.md. Availability, Booking, Payment, Coupon, Review,
    Notification, and Admin are not yet built and are intentionally omitted.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: User
  - name: Address
  - name: Salon
  - name: Branch
  - name: Staff
  - name: Service

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
      required: [success]

    SuccessFlag:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required: [success]

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]

    # ---------- Auth ----------
    SendOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{4,10}$'

    VerifyOtpResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
      required: [success, accessToken, refreshToken, user]

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 10

    RefreshTokenResponse:
      type: object
      description: Bare shape, no envelope — intentional, matches frontend_handover.md exactly.
      properties:
        accessToken:
          type: string
      required: [accessToken]

    # ---------- User ----------
    UserProfile:
      type: object
      description: No envelope wrapper — returned as-is.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Field is `name`, not `fullName` — intentional, differs from the PATCH body field.
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        dob:
          type: string
          format: date
          nullable: true
        profileImage:
          type: string
          nullable: true

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        gender:
          $ref: '#/components/schemas/Gender'
        dob:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Must be a valid date in the past.

    # ---------- Address ----------
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 50
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean

    CreateAddressRequest:
      type: object
      required: [addressLine1, city, state, postalCode]
      properties:
        label:
          type: string
          maxLength: 50
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        isDefault:
          type: boolean

    UpdateAddressRequest:
      allOf:
        - $ref: '#/components/schemas/CreateAddressRequest'
      description: All fields optional (partial of CreateAddressRequest).

    # ---------- Salon ----------
    Salon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        businessName:
          type: string
        gstNumber:
          type: string
        panNumber:
          type: string
        logo:
          type: string
          format: uri
        coverImage:
          type: string
          format: uri

    CreateSalonRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        businessName:
          type: string
          maxLength: 200
        gstNumber:
          type: string
          maxLength: 20
        panNumber:
          type: string
          maxLength: 20

    UpdateSalonRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        logo:
          type: string
          format: uri
        coverImage:
          type: string
          format: uri

    # ---------- Branch ----------
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        salonId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        totalChairs:
          type: integer
        openingTime:
          type: string
          example: "09:00"
        closingTime:
          type: string
          example: "21:00"

    CreateBranchRequest:
      type: object
      required:
        - salonId
        - name
        - addressLine1
        - city
        - state
        - postalCode
        - totalChairs
        - openingTime
        - closingTime
      properties:
        salonId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        totalChairs:
          type: integer
          minimum: 1
        openingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        closingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        addressLine1:
          type: string
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        totalChairs:
          type: integer
          minimum: 1
        openingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        closingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'

    CreateHolidayRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Must not be in the past.
        reason:
          type: string
          maxLength: 255

    CapacityRuleRequest:
      type: object
      required: [maxCapacityOverride]
      properties:
        maxCapacityOverride:
          type: integer
          minimum: 1

    # ---------- Staff ----------
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        staffType:
          type: string
          enum: [NORMAL, STAR]
        experienceYears:
          type: integer
        salary:
          type: number
        profileImage:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        joiningDate:
          type: string
          format: date
        bio:
          type: string
        consultationFee:
          type: number

    CreateStaffRequest:
      type: object
      required: [branchId, fullName, staffType]
      properties:
        branchId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 20
        staffType:
          type: string
          enum: [NORMAL, STAR]
        experienceYears:
          type: integer
          minimum: 0
        salary:
          type: number
          minimum: 0

    UpdateStaffRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 20
        staffType:
          type: string
          enum: [NORMAL, STAR]
        experienceYears:
          type: integer
          minimum: 0
        salary:
          type: number
          minimum: 0
        profileImage:
          type: string
          format: uri
        gender:
          $ref: '#/components/schemas/Gender'
        joiningDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        bio:
          type: string
          maxLength: 2000
        consultationFee:
          type: number
          minimum: 0

    CreateLeaveRequest:
      type: object
      required: [startDateTime, endDateTime]
      properties:
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
          description: Must be after startDateTime.
        reason:
          type: string
          maxLength: 255

    # ---------- Service ----------
    Service:
      type: object
      description: Table is `branch_services` in the DB, exposed as `/services`.
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        basePrice:
          type: number
        imageUrl:
          type: string

    CreateServiceRequest:
      type: object
      required: [branchId, categoryId, name, durationMinutes, basePrice]
      properties:
        branchId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        durationMinutes:
          type: integer
          minimum: 1
        basePrice:
          type: number
          exclusiveMinimum: 0

    UpdateServiceRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          minimum: 1
        basePrice:
          type: number
          exclusiveMinimum: 0
        imageUrl:
          type: string
          format: uri

    AssignStaffRequest:
      type: object
      required: [staffId]
      properties:
        staffId:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing/invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (or not owned by caller)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send email login OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limited
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP and create/login user
      description: First verify for an email auto-creates the user as role CUSTOMER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limited
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token (bare shape, no envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the presented refresh-token session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me:
    get:
      tags: [User]
      summary: Get current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile (no envelope wrapper)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [User]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/addresses:
    get:
      tags: [Address]
      summary: List the current user's addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Address]
      summary: Create an address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/me/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Address]
      summary: Update an owned address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Address]
      summary: Delete an owned address
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /salons:
    post:
      tags: [Salon]
      summary: Create salon registration
      description: >
        Salon Owner role required. First salon creation by a user auto-creates
        their salon_owner_profiles row (find-or-create).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalonRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Salon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Salon]
      summary: List salons owned by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Salon'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /salons/{salonId}:
    parameters:
      - name: salonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Salon]
      summary: Get an owned salon
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Salon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Salon]
      summary: Update an owned salon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalonRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Salon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Salon]
      summary: Soft-delete an owned salon
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /branches:
    post:
      tags: [Branch]
      summary: Create a branch under an owned salon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Branch]
      summary: List branches (optionally filtered by owned salon)
      security:
        - bearerAuth: []
      parameters:
        - name: salonId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When omitted, lists branches across every salon the caller owns.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
